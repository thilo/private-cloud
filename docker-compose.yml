# Personal Cloud — Seafile + Immich + Vaultwarden behind a hardened Caddy.
#
#   ./scripts/init.sh          # generate .env with strong secrets (run once)
#   docker compose up -d       # bring the stack up
#   ./scripts/bootstrap.sh     # create the Immich admin
#   ./scripts/verify.sh        # acceptance tests (file / password / photo)
#
# Hardening applied to every service: no-new-privileges, cap_drop ALL (+ only
# the capabilities an image genuinely needs), pinned images, internal networks
# for databases, and a single ingress (only Caddy publishes host ports).
# read_only root filesystem + tmpfs is applied wherever the upstream image
# tolerates it; see README "Hardening" for the per-image status.

name: private-cloud

x-restart: &restart unless-stopped

networks:
  # Public-facing bridge. Has egress (apps need it for app store / model
  # downloads). Fixed subnet keeps the proxy address range predictable.
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET}
  # Database tiers — internal:true blocks all egress; no published ports means
  # they are unreachable from the host or the Internet.
  immich-internal:
    internal: true
  seafile-internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  vaultwarden_data:
  immich_db:
  immich_modelcache:
  seafile_db:
  # Local SSD — latency-sensitive data that must NOT live on the (network) Storage
  # Box: the databases above, plus Seafile's conf/metadata and Immich's hot,
  # constantly-read derivatives.
  seafile_data:      # Seafile /shared parent (the seafile_box mount nests under it)
  seafile_logs:      # Seafile logs — kept local (per-request access logs are chatty)
  immich_thumbs:     # Immich thumbnails (read on every grid/scroll)
  immich_encoded:    # Immich transcoded video

  # Storage Box — cheap bulk blobs over CIFS/SMB. ${SB_*} come from .env.
  #   LOCAL : docker-compose.storagebox-sim.yml runs a Samba server at ${SB_HOST}.
  #   PROD  : ${SB_HOST} = u<id>.your-storagebox.de (a Hetzner Storage Box).
  # Ownership is fixed by the mount's uid=/gid= (CIFS can't be chown'd), so this is
  # NOT touched by volume-init. nobrl avoids CIFS byte-range-lock errors; the
  # databases live on local SSD precisely so they never need locking over SMB.
  # iocharset is intentionally NOT set: modern CIFS already maps filenames as
  # UTF-8 by default (via the built-in UTF-16 conversion in nls_ucs2_utils), so
  # Unicode names round-trip correctly. An explicit iocharset=utf8 would instead
  # require the nls_utf8 kernel module, which minimal cloud kernels (e.g. Ubuntu's
  # -virtual flavor) do not ship — that mount fails with a misleading
  # "can not access a needed shared library" error.
  immich_data:       # Immich originals: library/ + upload/ (uid 1000)
    driver: local
    driver_opts:
      type: cifs
      device: "//${SB_HOST}/${SB_SHARE}/immich"
      o: "username=${SB_USER},password=${SB_PASSWORD},uid=1000,gid=1000,file_mode=0700,dir_mode=0700,vers=${SB_SMB_VERS},cache=loose,nobrl"
  seafile_box:       # Seafile data tree: object store + conf + seahub-data (uid 8000)
    driver: local
    driver_opts:
      type: cifs
      device: "//${SB_HOST}/${SB_SHARE}/seafile"
      o: "username=${SB_USER},password=${SB_PASSWORD},uid=8000,gid=8000,file_mode=0700,dir_mode=0700,vers=${SB_SMB_VERS},cache=loose,nobrl"

services:

  # --------------------------------------------------------------- ingress --
  caddy:
    image: ${CADDY_IMAGE}
    container_name: pc-caddy
    restart: *restart
    mem_limit: 96m
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    environment:
      IMMICH_DOMAIN: ${IMMICH_DOMAIN}
      VAULTWARDEN_DOMAIN: ${VAULTWARDEN_DOMAIN}
      SEAFILE_DOMAIN: ${SEAFILE_DOMAIN}
      CADDY_TLS: ${CADDY_TLS}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      immich-server:
        condition: service_started
      vaultwarden:
        condition: service_started
      seafile-server:
        condition: service_started

  # ------------------------------------------------------------ vaultwarden --
  # One-shot chowner so the non-root services own their LOCAL data volumes before
  # they start: vaultwarden + immich run as uid 1000, seafile's daemons as uid 8000
  # (Seafile's NON_ROOT mode refuses to start unless /shared is writable). The CIFS
  # Storage Box volume (immich_data) is excluded — its ownership comes from the
  # mount's uid=, and CIFS can't be chown'd anyway.
  volume-init:
    image: alpine:3.20
    container_name: pc-volume-init
    command: ["sh", "-c", "chown -R 1000:1000 /vw && chmod 700 /vw && chown -R 1000:1000 /immich-thumbs /immich-encoded && chown -R 8000:8000 /seafile /seafile-logs"]
    volumes:
      - vaultwarden_data:/vw
      - immich_thumbs:/immich-thumbs
      - immich_encoded:/immich-encoded
      - seafile_data:/seafile
      - seafile_logs:/seafile-logs
    restart: "no"
    security_opt:
      - no-new-privileges:true

  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: pc-vaultwarden
    restart: *restart
    mem_limit: 96m
    user: "1000:1000"
    environment:
      DOMAIN: ${VAULTWARDEN_URL}
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: "8080"
      DATA_FOLDER: /data
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      PASSWORD_HINTS_ALLOWED: "false"
      TZ: ${TZ}
    volumes:
      - vaultwarden_data:/data
    networks:
      - proxy
    depends_on:
      volume-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/alive >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------- immich --
  immich-db:
    image: ${IMMICH_DB_IMAGE}
    container_name: pc-immich-db
    restart: *restart
    # 768M (not 512M): steady state is ~100M, but Immich's one-time first-boot
    # reverse-geocoding import (geodata_places) peaks at ~680M. A 512M cap OOM-kills
    # that import on a fresh DB (signal 9 mid-INSERT). 768M clears it with headroom.
    mem_limit: 768m
    shm_size: 128mb
    # Pin memory so the image does not auto-tune shared_buffers/effective_cache_size
    # to the host's total RAM (it would grab ~25% of the 4 GB box otherwise). We
    # MUST keep the image's default `-c config_file=...` first — that conf holds the
    # VectorChord shared_preload_libraries; the later -c flags override only the
    # memory params (command-line -c wins over the config file).
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=30
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_maintenance_workers=1
    environment:
      POSTGRES_DB: ${IMMICH_DB_NAME}
      POSTGRES_USER: ${IMMICH_DB_USER}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich_db:/var/lib/postgresql/data
    networks:
      - immich-internal
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
      # The immich postgres image writes a tuned config here on every start.
      - /etc/postgresql
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IMMICH_DB_USER} -d ${IMMICH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  immich-redis:
    image: ${VALKEY_IMAGE}
    container_name: pc-immich-redis
    restart: *restart
    mem_limit: 96m
    user: "999:1000"
    # No maxmemory/eviction policy: this Valkey is Immich's BullMQ job broker, so
    # evicting keys would silently drop queued jobs. The mem_limit is the only cap.
    command:
      - valkey-server
      - --requirepass
      - ${IMMICH_REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${IMMICH_REDIS_PASSWORD}
    networks:
      - immich-internal
    read_only: true
    tmpfs:
      - /tmp
      - /data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDISCLI_AUTH\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: pc-immich-server
    restart: *restart
    mem_limit: 1024m
    user: "1000:1000"
    environment:
      # Cap the V8 heap below the mem_limit so Node garbage-collects under pressure
      # instead of being OOM-killed (leaves headroom for off-heap libvips buffers).
      NODE_OPTIONS: "--max-old-space-size=768"
      DB_HOSTNAME: immich-db
      DB_USERNAME: ${IMMICH_DB_USER}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      REDIS_HOSTNAME: immich-redis
      REDIS_PASSWORD: ${IMMICH_REDIS_PASSWORD}
      IMMICH_MACHINE_LEARNING_URL: http://immich-ml:3003
      TZ: ${TZ}
    volumes:
      # Originals on the Storage Box; hot derivatives carved back to local SSD.
      # /data itself is the CIFS mount, so Immich's upload->library move stays
      # intra-device (no cross-device rename); thumbs + transcodes are local.
      - immich_data:/data
      - immich_thumbs:/data/thumbs
      - immich_encoded:/data/encoded-video
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy
      - immich-internal
    depends_on:
      volume-init:
        condition: service_completed_successfully
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true

  immich-ml:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    container_name: pc-immich-ml
    restart: *restart
    mem_limit: 1024m
    environment:
      TZ: ${TZ}
      # Keep the ML peak bounded for the 4 GB box: unload idle models after 5 min,
      # a single worker, and serialized inference so concurrent jobs don't stack
      # multiple model copies in RAM. Jobs throttle/retry rather than OOM the host.
      MACHINE_LEARNING_MODEL_TTL: "300"
      MACHINE_LEARNING_WORKERS: "1"
      MACHINE_LEARNING_REQUEST_THREADS: "1"
    volumes:
      - immich_modelcache:/cache
    networks:
      - proxy
    # read_only not applied — the ML runtime's control server writes a socket on
    # its rootfs that a read-only fs rejects. Still hardened: cap_drop ALL +
    # no-new-privileges, no published ports. See README "Hardening".
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------- seafile --
  # Reliable file sync with client-side encrypted libraries (the E2EE that
  # actually works on iOS). MariaDB + Redis are fully hardened like the other
  # data tiers; the Seafile app image keeps init/nginx as root (see "Hardening"
  # in the README) but runs the seaf-server/seahub daemons non-root via NON_ROOT.
  seafile-db:
    image: ${SEAFILE_DB_IMAGE}
    container_name: pc-seafile-db
    restart: *restart
    mem_limit: 320m
    # Trim MariaDB's footprint (the entrypoint prepends `mariadbd` to these flags).
    command:
      - --innodb-buffer-pool-size=96M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --key-buffer-size=8M
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${SEAFILE_DB_ROOT_PASSWORD}
      MYSQL_LOG_CONSOLE: "true"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - seafile_db:/var/lib/mysql
    networks:
      - seafile-internal
    read_only: true
    tmpfs:
      - /tmp
      - /run/mysqld
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  seafile-redis:
    image: ${REDIS_IMAGE}
    container_name: pc-seafile-redis
    restart: *restart
    mem_limit: 96m
    user: "999:1000"
    command:
      - redis-server
      - --requirepass
      - ${SEAFILE_REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      # Pure cache (Seafile CACHE_PROVIDER=redis): bound it and evict LRU keys.
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDISCLI_AUTH: ${SEAFILE_REDIS_PASSWORD}
    networks:
      - seafile-internal
    read_only: true
    tmpfs:
      - /tmp
      - /data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDISCLI_AUTH\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  seafile-server:
    image: ${SEAFILE_IMAGE}
    container_name: pc-seafile
    restart: *restart
    mem_limit: 640m
    environment:
      SEAFILE_MYSQL_DB_HOST: seafile-db
      SEAFILE_MYSQL_DB_PORT: "3306"
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_DB_PASSWORD}
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${SEAFILE_DB_ROOT_PASSWORD}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: ${TZ}
      INIT_SEAFILE_ADMIN_EMAIL: ${SEAFILE_ADMIN_EMAIL}
      INIT_SEAFILE_ADMIN_PASSWORD: ${SEAFILE_ADMIN_PASSWORD}
      # Hostname includes the port so Seahub emits correct absolute URLs and
      # CSRF origins on the non-standard local HTTPS port (harmless :443 in prod).
      SEAFILE_SERVER_HOSTNAME: "${SEAFILE_DOMAIN}:${HTTPS_PORT}"
      SEAFILE_SERVER_PROTOCOL: https
      SITE_ROOT: /
      # Drop the seaf-server/seahub daemons to uid 8000 (init/nginx stay root).
      NON_ROOT: "true"
      JWT_PRIVATE_KEY: ${SEAFILE_JWT_KEY}
      SEAFILE_LOG_TO_STDOUT: "false"
      ENABLE_GO_FILESERVER: "true"
      # Optional extras kept off to stay lean (file sync + E2EE only).
      ENABLE_SEADOC: "false"
      ENABLE_NOTIFICATION_SERVER: "false"
      ENABLE_SEAFILE_AI: "false"
      ENABLE_FACE_RECOGNITION: "false"
      CACHE_PROVIDER: redis
      REDIS_HOST: seafile-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SEAFILE_REDIS_PASSWORD}
    volumes:
      - seafile_data:/shared
      # Mount the Storage Box one level ABOVE seafile-data: the bootstrap skips
      # first-run setup iff /shared/seafile/seafile-data exists, so mounting the
      # (empty) box at /shared/seafile lets setup run and create seafile-data on the
      # box — single-shot, no two-phase. DB metadata stays in MariaDB (local); logs
      # go to a local volume (below) so nothing chatty is written over CIFS.
      - seafile_box:/shared/seafile
      - seafile_logs:/shared/seafile/logs
    networks:
      - proxy
      - seafile-internal
    depends_on:
      volume-init:
        condition: service_completed_successfully
      seafile-db:
        condition: service_healthy
      seafile-redis:
        condition: service_started
    # read_only not applied — the seafile-mc image regenerates config and runs
    # its own nginx/my_init across the rootfs. Still hardened: cap_drop ALL +
    # no-new-privileges + non-root daemons (NON_ROOT) + internal-only DB/cache.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, NET_BIND_SERVICE, KILL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
